name: Build PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable code tests (DEF / SFF / content scanner, with sanitizers)
        run: sh tests/run.sh

      - name: Real-asset sprite decoding tests (Ikemen GO default content)
        run: |
          git clone --depth 1 https://github.com/ikemen-engine/Ikemen_GO-Elecbyte-Screenpack ../screenpack
          sh tests/run_real.sh ../screenpack

  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf automake bison flex gcc libelf-dev make texinfo \
            libncurses5-dev patch python3 python-is-python3 wget zlib1g-dev libtool-bin \
            python3-dev bzip2 libgmp3-dev pkg-config libssl-dev

      # The ps3dev project publishes a ready-made compiler + PSL1GHT (nothing to compile here).
      - name: Download pre-built PS3 toolchain + PSL1GHT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/ps3dev/ps3dev/releases?per_page=30" --jq '[.[] | select(.draft | not) | .assets[] | select(.name == "ps3dev-linux-X64.tar.gz")] | sort_by(.created_at) | reverse | .[0].browser_download_url')
          echo "Using: $url"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "No ps3dev-linux-X64.tar.gz asset found. Recent assets:"
            gh api "repos/ps3dev/ps3dev/releases?per_page=5" --jq '.[] | .tag_name + ": " + ([.assets[].name] | join(", "))'
            exit 1
          fi
          curl -fsSL "$url" | tar xz -C "$HOME"
          echo "PS3DEV=$HOME/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$HOME/ps3dev" >> "$GITHUB_ENV"
          echo "$HOME/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$HOME/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$HOME/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain is usable
        run: |
          ppu-gcc --version | head -1
          test -f "$PSL1GHT/ppu_rules" && echo "PSL1GHT found"

      - name: Show repo layout (for debugging)
        run: |
          pwd
          ls -la
          echo "--- Makefile (first lines):"
          head -20 Makefile
          echo "--- sources:"
          ls source include pkgfiles 2>&1

      - name: Build the package
        run: make pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-ps3-pkg
          path: "*.pkg"
