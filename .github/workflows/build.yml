name: Build PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks that need no network. The package is only built if these pass.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project folder (Makefile + source/)
        run: |
          dir=""
          for m in $(find . -maxdepth 3 -name Makefile -not -path './.git/*'); do
            d=$(dirname "$m")
            if [ -d "$d/source" ]; then dir="$d"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "No folder with a Makefile and source/ found. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Portable code tests (DEF / SFF / content scanner, with sanitizers)
        working-directory: ${{ env.PROJECT_DIR }}
        run: sh tests/run.sh

      - name: Safety checks (no risky calls, path guard, hostile-file tests)
        working-directory: ${{ env.PROJECT_DIR }}
        run: sh tests/run_safety.sh

  # Needs the Ikemen GO default content from GitHub; does not block the package.
  real-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project folder (Makefile + source/)
        run: |
          dir=""
          for m in $(find . -maxdepth 3 -name Makefile -not -path './.git/*'); do
            d=$(dirname "$m")
            if [ -d "$d/source" ]; then dir="$d"; break; fi
          done
          [ -n "$dir" ] || { echo "No project folder found"; exit 1; }
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Get Ikemen GO default content
        run: git clone --depth 1 https://github.com/ikemen-engine/Ikemen_GO-Elecbyte-Screenpack "$RUNNER_TEMP/screenpack"

      - name: Real-asset sprite decoding tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: sh tests/run_real.sh "$RUNNER_TEMP/screenpack"

      - name: Fight engine tests (animations, commands, states, a real fight)
        working-directory: ${{ env.PROJECT_DIR }}
        run: sh tests/run_engine.sh "$RUNNER_TEMP/screenpack"

      - name: Fuzz real files (sanitizers + memory cap)
        working-directory: ${{ env.PROJECT_DIR }}
        run: sh tests/run_safety.sh "$RUNNER_TEMP/screenpack"

  pkg:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project folder (Makefile + source/)
        run: |
          dir=""
          for m in $(find . -maxdepth 3 -name Makefile -not -path './.git/*'); do
            d=$(dirname "$m")
            if [ -d "$d/source" ]; then dir="$d"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "No folder with a Makefile and source/ found. Repo contents:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf automake bison flex gcc libelf-dev make texinfo \
            libncurses5-dev patch python3 python-is-python3 wget zlib1g-dev libtool-bin \
            python3-dev bzip2 libgmp3-dev pkg-config libssl-dev

      # The ps3dev project publishes a ready-made compiler + PSL1GHT (nothing to compile here).
      - name: Download pre-built PS3 toolchain + PSL1GHT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/ps3dev/ps3dev/releases?per_page=30" --jq '[.[] | select(.draft | not) | .assets[] | select(.name == "ps3dev-linux-X64.tar.gz")] | sort_by(.created_at) | reverse | .[0].browser_download_url')
          echo "Using: $url"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "No ps3dev-linux-X64.tar.gz asset found."
            exit 1
          fi
          curl -fsSL "$url" | tar xz -C "$HOME"
          echo "PS3DEV=$HOME/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$HOME/ps3dev" >> "$GITHUB_ENV"
          echo "$HOME/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$HOME/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$HOME/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain is usable
        run: |
          ppu-gcc --version | head -1
          test -f "$PSL1GHT/ppu_rules" && echo "PSL1GHT found"

      - name: Build the package
        working-directory: ${{ env.PROJECT_DIR }}
        run: make pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-ps3-pkg
          path: ${{ env.PROJECT_DIR }}/*.pkg
